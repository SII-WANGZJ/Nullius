[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullius"
version = "0.2.0"
description = "A reproducible audit of the computational claims in arXiv:2604.27092"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Zhengjie Wang", email = "wangzhengjie@sii.edu.cn" },
]
keywords = [
    "reproducibility", "benchmark integrity", "data leakage",
    "autonomous discovery", "optical computing",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/REPLACE-ME/nullius"
"Target preprint" = "https://arxiv.org/abs/2604.27092"
"Audited deposit" = "https://doi.org/10.5281/zenodo.19890402"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
